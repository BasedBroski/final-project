<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soyjak Arcade | Profile</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../styles/common.css">
</head>
<body data-require-login="true" data-login-url="login.html" data-home-url="../index.html">
  <header>
    <nav class="navbar bg-body-tertiary border-bottom" aria-label="Main navigation">
      <div class="container d-flex gap-2">
        <a class="navbar-brand fw-semibold" href="../index.html">Soyjak Arcade</a>
        <span class="small text-muted ms-auto align-self-center" data-auth-user>Not signed in</span>
        <a class="btn btn-outline-primary btn-sm" href="login.html" data-auth-login>Login</a>
        <a class="btn btn-outline-secondary btn-sm d-none" href="profile.html" data-auth-profile>Profile</a>
        <button class="btn btn-outline-danger btn-sm d-none" type="button" data-auth-logout>Logout</button>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <article class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h1 class="h3 mb-1">Profile</h1>
            <p class="text-muted mb-4">Profile display for <strong id="profile-username">player</strong></p>

            <div class="row g-4 align-items-start">
              <div class="col-md-4 text-center">
                <img id="profile-avatar" src="" alt="Profile avatar" class="img-fluid rounded border max-w-180 is-hidden">
                <p id="profile-avatar-placeholder" class="small text-muted mb-0">No avatar uploaded yet.</p>
              </div>

              <div class="col-md-8">
                <p id="profile-bio" class="text-muted mb-3">No bio saved yet.</p>

                <dl class="row mb-3">
                  <dt class="col-sm-4">Twitter</dt>
                  <dd class="col-sm-8"><a id="profile-twitter" href="#" target="_blank" rel="noopener noreferrer">Not set</a></dd>
                  <dt class="col-sm-4">Instagram</dt>
                  <dd class="col-sm-8"><a id="profile-instagram" href="#" target="_blank" rel="noopener noreferrer">Not set</a></dd>
                </dl>
              </div>
            </div>

            <a class="btn btn-primary" href="profile-creator.html">Edit Profile</a>
            <a class="btn btn-outline-secondary ms-2" href="../index.html">Back Home</a>
          </div>
        </article>
      </div>
    </div>
  </main>

    <footer class="container pb-4 pt-2">
    <hr>
    <ul class="list-inline mb-0 footer-links">
      <li class="list-inline-item"><a href="https://basedbroski.github.io/dev-page/" target="_blank" rel="noopener noreferrer">Dev Page</a></li>
      <li class="list-inline-item"><a href="https://github.com/BasedBroski/game-project" target="_blank" rel="noopener noreferrer">Game Repo</a></li>
      <li class="list-inline-item"><a href="https://github.com/BasedBroski" target="_blank" rel="noopener noreferrer">GitHub Profile</a></li>
      <li class="list-inline-item"><a id="nu-validator-link" href="#" target="_blank" rel="noopener noreferrer">Nu HTML Validator</a></li>
      <li class="list-inline-item"><a id="wave-link" href="#" target="_blank" rel="noopener noreferrer">WAVE Checker</a></li>
    </ul>
  </footer>

  <script src="../scripts/auth.js"></script>
  <script src="../scripts/profile.js"></script>
  <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
  ></script>
</body>
</html>
