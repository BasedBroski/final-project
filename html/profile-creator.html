<!DOCTYPE html>
<!-- File: profile-creator.html - page markup -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soyjak Arcade | Profile Creator</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/common.css">
</head>

<body data-require-login="true" data-login-url="login.html" data-home-url="../index.html">
    <header>
    <!-- Main navigation -->
        <nav class="navbar bg-body-tertiary border-bottom" aria-label="Main navigation">
      <div class="container d-flex gap-2">
        <a class="navbar-brand fw-semibold" href="../index.html">Soyjak Arcade</a>
        <span class="small text-muted ms-auto align-self-center" data-auth-user>Not signed in</span>
        <a class="btn btn-outline-primary btn-sm" href="login.html" data-auth-login>Login</a>
        <a class="btn btn-outline-secondary btn-sm d-none" href="profile.html" data-auth-profile>Profile</a>
        <button class="btn btn-outline-danger btn-sm d-none" type="button" data-auth-logout>Logout</button>
      </div>
    </nav>
    </header>

  <!-- Main content area -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <article class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-1">Profile Creator</h1>
                        <p class="text-muted mb-4">Edit your public profile details. This page is your editor.</p>

                        <form id="profileForm" novalidate>
                            <p class="small text-muted mb-3">Editing profile for <strong id="profile-creator-username">account</strong></p>

                            <div class="mb-3">
                                <label for="profilePicInput" class="form-label">Profile Picture</label>
                                <input class="form-control" type="file" id="profilePicInput" accept="image/*">
                                <img id="profilePicPreview" src="" alt="Preview" class="mt-2 rounded border max-w-150 is-block">
                            </div>

                            <div class="mb-3">
                                <label for="profileDescription" class="form-label">Description</label>
                                <textarea class="form-control" id="profileDescription" rows="3" maxlength="180" placeholder="Tell us a bit about yourself"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="socialTwitter" class="form-label">Twitter URL</label>
                                <input type="url" class="form-control" id="socialTwitter" placeholder="https://twitter.com/yourhandle">
                            </div>

                            <div class="mb-3">
                                <label for="socialInstagram" class="form-label">Instagram URL</label>
                                <input type="url" class="form-control" id="socialInstagram" placeholder="https://instagram.com/yourhandle">
                            </div>

                            <p id="profile-creator-status" class="text-success small mb-3" aria-live="polite"></p>
                            <button type="button" class="btn btn-primary" id="saveProfile">Save Profile</button>
                            <a href="profile.html" class="btn btn-outline-secondary ms-2">View Profile</a>
                        </form>
                    </div>
                </article>
            </div>
        </div>
    </main>
    <script src="../scripts/auth.js"></script>
    <script src="../scripts/profile-creator.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>
</body>
</html>
