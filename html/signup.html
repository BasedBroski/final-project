<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soyjak Arcade | Sign Up</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../styles/common.css">
</head>
<body data-login-url="login.html">
  <header>
    <nav class="navbar bg-body-tertiary border-bottom" aria-label="Main navigation">
      <div class="container d-flex gap-2">
        <a class="navbar-brand fw-semibold" href="../index.html">Soyjak Arcade</a>
        <a class="btn btn-outline-secondary btn-sm ms-auto" href="../index.html">Back to Home</a>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <article class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h1 class="h3 mb-2">Create Account</h1>
            <p class="text-muted small mb-4">Sign up to create your profile and save scores under your username.</p>

            <form id="signup-form" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username" type="text" class="form-control" required minlength="3" maxlength="18" pattern="[A-Za-z0-9_-]{3,18}">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" type="password" class="form-control" required minlength="4" maxlength="50">
              </div>

              <div class="mb-3">
                <label for="confirm-password" class="form-label">Confirm Password</label>
                <input id="confirm-password" type="password" class="form-control" required minlength="4" maxlength="50">
              </div>

              <p id="signup-error" class="text-danger small mb-3" aria-live="polite"></p>
              <button class="btn btn-primary w-100" type="submit">Sign Up</button>
            </form>

            <p class="small text-muted mt-3 mb-0">Already have an account? <a href="login.html">Sign in</a>.</p>
          </div>
        </article>
      </div>
    </div>
  </main>

  <script src="../scripts/auth.js"></script>
  <script src="../scripts/signup.js"></script>
</body>
</html>
