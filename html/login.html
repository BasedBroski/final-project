<!DOCTYPE html>
<!-- File: login.html - page markup -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soyjak Arcade | Login</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../styles/common.css">
</head>

<body data-login-url="login.html">
  <header>
    <!-- Main navigation -->
    <nav class="navbar bg-body-tertiary border-bottom" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="../index.html">Soyjak Arcade</a>
        <a class="btn btn-secondary btn-sm" href="../index.html">Back to Home</a>
      </div>
    </nav>
  </header>

  <!-- Main content area -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <article class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h1 class="h3 mb-2">Sign In</h1>
            <p class="text-muted small mb-3">Sign in with your account, or use the demo account for quick grading.</p>

            <div class="alert alert-info py-2 px-3" role="note" aria-label="Demo login credentials">
              <p class="mb-1 small"><strong>Demo Login</strong></p>
              <p class="mb-1 small">Username: <strong>player</strong></p>
              <p class="mb-0 small">Password: <strong>soy</strong></p>
            </div>

            <form id="login-form" novalidate>
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username" type="text" class="form-control" required autocomplete="username">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <input id="password" type="password" class="form-control" required autocomplete="current-password">
                  <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Toggle password visibility">Show</button>
                </div>
              </div>

              <p id="login-error" class="text-danger small mb-3" aria-live="polite"></p>
              <button id="login-button" class="btn btn-primary w-100" type="submit">Sign In</button>
            </form>
            <p class="small text-muted mt-3 mb-0">Need an account? <a href="signup.html">Create one here</a>.</p>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="container pb-4 pt-2">
    <hr>
    <ul class="list-inline mb-0 footer-links">
      <li class="list-inline-item"><a id="nu-validator-link" href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fbasedbroski.github.io%2Fgame-project%2Fhtml%2Flogin.html" target="_blank" rel="noopener noreferrer">Nu HTML Validator</a></li>
      <li class="list-inline-item"><a id="wave-link" href="https://wave.webaim.org/report#/https://basedbroski.github.io/game-project/html/login.html" target="_blank" rel="noopener noreferrer">WAVE Checker</a></li>
    </ul>
  </footer>

  <script src="../scripts/auth.js"></script>
  <script src="../scripts/login.js"></script>
</body>
</html>
